<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workshop</title>
    <link rel="stylesheet" href="/board.css">
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Tire workshop</p>
          <h1>Your car</h1>
        </div>
      </div>
      <time id="clock"></time>
    </header>
    <p id="connection" class="connection" hidden>Reconnecting to the workshop computer…</p>
    <main>
      <section id="empty" class="empty" hidden>
        <p class="empty-title">The board is clear</p>
        <p>Cars show up here when work starts, and again when they are ready.</p>
      </section>
      <section id="ready-zone" class="zone ready-zone" hidden>
        <div class="zone-head">
          <h2>Ready</h2>
          <p id="ready-hint" class="hint">We will bring the car out to you</p>
        </div>
        <div id="ready" class="grid" aria-live="polite"></div>
      </section>
      <section id="working-zone" class="zone" hidden>
        <div class="zone-head">
          <h2>In the workshop</h2>
          <p class="hint">Selected and being worked on</p>
        </div>
        <div id="working" class="grid"></div>
      </section>
      <footer id="waiting-zone" class="queue" hidden>
        <span>Waiting</span>
        <div id="waiting"></div>
      </footer>
    </main>
    <script type="module" src="/board.js"></script>
  </body>
</html>
